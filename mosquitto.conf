# /etc/mosquitto/mosquitto.conf
# Raspberry Pi 10.29.43.197 — RCI3D Project

# TCP — pour OctoPrint plugin (local au Pi)
listener 1883
protocol mqtt

# WebSocket — OBLIGATOIRE pour l'app web Firebase
# Le navigateur ne peut PAS utiliser TCP raw
listener 9001
protocol websockets

# Authentification
allow_anonymous false
password_file /etc/mosquitto/passwd

# Logs
log_dest file /var/log/mosquitto/mosquitto.log
log_type all
