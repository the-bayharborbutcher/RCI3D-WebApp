<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCI3D - Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .offline-box {
            max-width: 380px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.7; transform: scale(0.95); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            font-size: 16px;
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-retry {
            display: inline-block;
            padding: 14px 32px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .info {
            margin-top: 30px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            font-size: 14px;
            opacity: 0.9;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="offline-box">
        <div class="logo">⬡ RCI3D</div>
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>No internet connection detected. Connect to your network to access your 3D printers remotely.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            🔄 Try Again
        </button>
        <div class="info">
            💡 Tip: Make sure your device is connected to the same WiFi network as your Raspberry Pi to access OctoPrint.
        </div>
    </div>
</body>
</html>
