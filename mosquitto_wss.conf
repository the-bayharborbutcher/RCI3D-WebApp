# /etc/mosquitto/conf.d/websocket.conf
# RCI3D — Mosquitto avec WSS (WebSocket Secure)

# Port TCP local — pour plugin OctoPrint-MQTT (pas de SSL nécessaire)
listener 1883
protocol mqtt
allow_anonymous true

# Port WSS — pour l'app Firebase (HTTPS oblige WSS)
listener 9001
protocol websockets
allow_anonymous true
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
